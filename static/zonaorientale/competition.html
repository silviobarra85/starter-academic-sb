<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Competizione - ZonaOrientale Salerno</title>
  <meta name="description" content="Calendario completo competizione ZonaOrientale Salerno." />
  <link rel="icon" href="./favicon.ico" sizes="any" />
  <script>document.documentElement.dataset.theme = localStorage.getItem("zonaOrientaleTheme") || "dark";</script>
  <link rel="stylesheet" href="./assets/styles.css?v=118" />
</head>
<body>
  <main class="container app-main competition-page-main">
    <section class="page-heading">
      <div>
        <p class="eyebrow">Competizione</p>
        <h1 id="competitionPageTitle">Calendario competizione</h1>
        <p id="competitionPageSubtitle" class="subtitle">Caricamento calendario...</p>
        <div id="competitionPageMeta" class="competition-page-meta"></div>
      </div>
      <div class="competition-page-actions">
        <a class="button button-secondary" href="./#competitions">Torna alle competizioni</a>
      </div>
    </section>

    <section id="competitionPageError" class="notice notice-error hidden"></section>
    <section id="competitionPageContent" class="competition-page-grid">
      <article class="panel competition-page-empty"><p class="muted">Caricamento...</p></article>
    </section>
  </main>

  <footer class="container app-footer">
    <p>ZonaOrientale Salerno · V116 admin snapshot e badge fonti · Ultimo aggiornamento 20/05/2026</p>
  </footer>

  <script type="module">
    const params = new URLSearchParams(window.location.search);
    const requestedSeasonId = params.get("seasonId") || "";
    const requestedCompetitionId = params.get("competitionId") || "";
    let currentCompetitionPayload = null;
    const requestedStaticCalendarId = params.get("staticCalendarId") || "";
    const requestedSlug = params.get("slug") || "";

    const titleEl = document.getElementById("competitionPageTitle");
    const subtitleEl = document.getElementById("competitionPageSubtitle");
    const metaEl = document.getElementById("competitionPageMeta");
    const contentEl = document.getElementById("competitionPageContent");
    const errorEl = document.getElementById("competitionPageError");

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function normalizeKey(value) {
      return String(value || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[’']/g, "")
        .replace(/[^a-z0-9]+/g, " ")
        .trim();
    }

    function slugify(value) {
      return normalizeKey(value).replace(/\s+/g, "-");
    }

    let firebaseSeasonSnapshotCache = null;

    function isMatchDeleted(match) {
      return match?.deleted === true || String(match?.deleted || "").toLowerCase() === "true" || String(match?.status || "").toUpperCase() === "DELETED";
    }

    function getMatchMergeKey(match) {
      return [
        match?.competitionId || "",
        normalizeKey(match?.matchday || match?.stage || ""),
        String(match?.serieAMatchday || ""),
        match?.homeSeasonTeamId || normalizeKey(match?.homeTeamName || ""),
        match?.awaySeasonTeamId || normalizeKey(match?.awayTeamName || "")
      ].join("|");
    }

    async function loadFirebaseSeasonSnapshot() {
      if (!requestedSeasonId) return null;
      if (firebaseSeasonSnapshotCache !== null) return firebaseSeasonSnapshotCache;
      try {
        const { db, doc, getDoc } = await import("./assets/firebase.js");
        const snapshot = await getDoc(doc(db, "publicSeasonSnapshots", requestedSeasonId));
        firebaseSeasonSnapshotCache = snapshot.exists() ? (snapshot.data() || {}) : null;
        return firebaseSeasonSnapshotCache;
      } catch (error) {
        console.warn("Snapshot Firebase non disponibile", error);
        firebaseSeasonSnapshotCache = null;
        return null;
      }
    }

    function getDeletedMatchKeys(snapshotData, competitionId) {
      const keys = new Set();
      (Array.isArray(snapshotData?.competitionMatches) ? snapshotData.competitionMatches : []).forEach((match) => {
        if (match.competitionId !== competitionId || !isMatchDeleted(match)) return;
        if (match.id) keys.add(`id:${match.id}`);
        keys.add(`key:${getMatchMergeKey(match)}`);
      });
      return keys;
    }

    function filterDeletedMatches(matches, deletedKeys = new Set()) {
      return (matches || []).filter((match) => {
        if (isMatchDeleted(match)) return false;
        if (deletedKeys.has(`id:${match.id || ""}`)) return false;
        if (deletedKeys.has(`key:${getMatchMergeKey(match)}`)) return false;
        return true;
      });
    }

    async function fetchJson(url, options = {}) {
      const response = await fetch(url, options);
      if (!response.ok) throw new Error(`Impossibile caricare ${url}`);
      return response.json();
    }

    async function loadStaticManifest() {
      try {
        const manifest = await fetchJson("./assets/competitions/manifest.json", { cache: "no-store" });
        const competitions = Array.isArray(manifest.competitions) ? manifest.competitions : Array.isArray(manifest.items) ? manifest.items : [];
        return { ...manifest, competitions };
      } catch (error) {
        return { competitions: [] };
      }
    }

    function findStaticManifestEntry(manifest) {
      const entries = manifest.competitions || [];
      return entries.find((entry) => {
        if (requestedStaticCalendarId && entry.id === requestedStaticCalendarId) return true;
        if (requestedCompetitionId && entry.competitionId === requestedCompetitionId) return true;
        if (requestedSeasonId && entry.seasonId && entry.seasonId !== requestedSeasonId) return false;
        if (requestedSlug && (entry.competitionSlug === requestedSlug || slugify(entry.competitionName || entry.label || entry.id) === requestedSlug)) return true;
        return false;
      }) || null;
    }

    async function loadStaticCompetition() {
      const manifest = await loadStaticManifest();
      const entry = findStaticManifestEntry(manifest);
      if (!entry?.file) return null;
      const payload = await fetchJson(`./assets/competitions/${entry.file}`, { cache: "no-store" });
      currentCompetitionPayload = payload;
      const competition = payload.competition || {};
      const meta = payload.meta || {};
      const competitionId = competition.id || meta.competitionId || entry.competitionId || requestedCompetitionId;
      const snapshotData = await loadFirebaseSeasonSnapshot();
      getDeletedMatchKeys(snapshotData, competitionId);
      return {
        source: "static",
        manifestEntry: entry,
        competition: {
          id: competitionId,
          seasonId: competition.seasonId || meta.seasonId || entry.seasonId || requestedSeasonId,
          name: competition.name || meta.competitionName || entry.competitionName || entry.label || "Competizione",
          type: competition.type || meta.competitionType || entry.competitionType || "ALTRO",
          status: competition.status || entry.status || "",
          notes: competition.notes || ""
        },
        matches: filterDeletedMatches(Array.isArray(payload.matches) ? payload.matches.map((match) => ({ ...match, competitionId: match.competitionId || competitionId })) : [], new Set()),
        results: Array.isArray(payload.results) ? payload.results : [],
        sourceFile: entry.sourceFile || meta.sourceFile || "assets/competitions"
      };
    }

    async function loadFirebaseCompetition() {
      if (!requestedSeasonId) return null;
      try {
        const data = await loadFirebaseSeasonSnapshot();
        if (!data) return null;
        const competitions = Array.isArray(data.competitions) ? data.competitions : [];
        const competition = competitions.find((item) => {
          if (requestedCompetitionId && item.id === requestedCompetitionId) return true;
          if (requestedSlug && slugify(item.name || item.competitionName || item.label || item.type || item.id) === requestedSlug) return true;
          return false;
        }) || null;
        if (!competition) return null;
        return {
          source: "firebase",
          competition,
          matches: filterDeletedMatches((Array.isArray(data.competitionMatches) ? data.competitionMatches : []).filter((match) => match.competitionId === competition.id)),
          results: (Array.isArray(data.competitionResults) ? data.competitionResults : []).filter((result) => result.competitionId === competition.id),
          seasonTeams: Array.isArray(data.seasonTeams) ? data.seasonTeams : []
        };
      } catch (error) {
        console.warn("Fallback Firebase non disponibile", error);
        return null;
      }
    }

    function getTeamName(match, side, seasonTeams = []) {
      const id = side === "home" ? match.homeSeasonTeamId : match.awaySeasonTeamId;
      const name = side === "home" ? match.homeTeamName : match.awayTeamName;
      if (name) return name;
      const team = seasonTeams.find((item) => item.id === id);
      return team?.name || id || "-";
    }

    function formatNumber(value) {
      if (value === null || value === undefined || value === "") return "";
      const number = Number(value);
      return Number.isFinite(number) ? number.toLocaleString("it-IT", { maximumFractionDigits: 2 }) : String(value);
    }

    function formatMatchResult(match) {
      const hasGoals = match.homeGoals !== "" && match.homeGoals !== undefined && match.homeGoals !== null && match.awayGoals !== "" && match.awayGoals !== undefined && match.awayGoals !== null;
      const goals = hasGoals ? `${match.homeGoals}-${match.awayGoals}` : "-";
      const hasFp = match.homeScore !== "" && match.homeScore !== undefined && match.homeScore !== null && match.awayScore !== "" && match.awayScore !== undefined && match.awayScore !== null;
      return hasFp ? `${goals} · (${formatNumber(match.homeScore)}-${formatNumber(match.awayScore)})` : goals;
    }

    function renderMatchResultHtml(match) {
      const hasGoals = match.homeGoals !== "" && match.homeGoals !== undefined && match.homeGoals !== null && match.awayGoals !== "" && match.awayGoals !== undefined && match.awayGoals !== null;
      const goals = hasGoals ? `${match.homeGoals}-${match.awayGoals}` : "-";
      const hasFp = match.homeScore !== "" && match.homeScore !== undefined && match.homeScore !== null && match.awayScore !== "" && match.awayScore !== undefined && match.awayScore !== null;
      const scoreHtml = `<strong class="match-result-goals">${escapeHtml(goals)}</strong>`;
      if (!hasFp) return scoreHtml;
      return `${scoreHtml} <span class="match-result-separator">·</span> <span class="match-result-fp">(${escapeHtml(formatNumber(match.homeScore))}-${escapeHtml(formatNumber(match.awayScore))})</span>`;
    }

    function cleanStageText(value) {
      return String(value || "").replace(/[_-]+/g, " ").replace(/\s+/g, " ").trim().toUpperCase();
    }

    function getCompetitionKindText(competition) {
      return cleanStageText([
        competition?.name,
        competition?.competitionName,
        competition?.staticCompetitionName,
        competition?.label,
        competition?.type,
        competition?.competitionType,
        competition?.formula
      ].filter(Boolean).join(" "));
    }

    function isLeagueCompetition(competition) {
      const text = getCompetitionKindText(competition);
      return /CAMPIONATO|REGULAR\s*SEASON|REGULAR|LEGA|LEAGUE\s*TABLE/.test(text) && !/CHAMPIONS|CHAMPION|COPPA|PLAYOFF|PLAY\s*OFF|SUPERCOPPA|FINAL|KNOCK/.test(text);
    }

    function getMatchDaySortValue(match) {
      const candidates = [match?.leagueMatchday, match?.serieAMatchday, match?.matchday, match?.stage, match?.id];
      for (const value of candidates) {
        const matchNumber = String(value || "").match(/\d+/);
        if (matchNumber) {
          const number = Number(matchNumber[0]);
          if (Number.isFinite(number)) return number;
        }
      }
      return 0;
    }

    function getExplicitBaseStage(match) {
      const stageRaw = cleanStageText(match.stage || match.phase || match.round || "");
      const legRaw = cleanStageText(match.leg || match.roundLeg || "");
      const matchdayRaw = cleanStageText(match.matchday || "");
      const combinedOriginal = `${stageRaw} ${legRaw} ${matchdayRaw}`.trim();
      const combined = combinedOriginal.replace(/FINAL\s+FOUR/g, " ").replace(/\s+/g, " ").trim();
      if (/FINALE|FINAL\b|(^|\s)F(\s|$)/.test(combined)) return { key: "finale", label: "Finale", rank: 900 };
      if (/SEMIFINAL|SEMI|\bSF\b/.test(combined)) return { key: "semifinali", label: "Semifinali", rank: 800 };
      if (/QUARTI|QUART|\bQF\b/.test(combined)) return { key: "quarti-finale", label: "Quarti di finale", rank: 700 };
      if (/OTTAVI|OTTAV|\bR16\b/.test(combined)) return { key: "ottavi-finale", label: "Ottavi di finale", rank: 600 };
      if (/FINAL\s+FOUR/.test(combinedOriginal)) return { key: "final-four", label: "Final Four", rank: 650 };
      return null;
    }

    function shouldInferFinalForUnknownKnockout(match, matches, competition) {
      if (!match || isLeagueCompetition(competition)) return false;
      if (getExplicitBaseStage(match)) return false;
      const unknownMatches = (matches || []).filter((item) => !getExplicitBaseStage(item));
      if (unknownMatches.length !== 1 || unknownMatches[0] !== match) return false;
      const knownStages = (matches || []).map(getExplicitBaseStage).filter(Boolean).map((stage) => stage.key);
      if (!knownStages.some((key) => key === "semifinali" || key === "quarti-finale" || key === "ottavi-finale" || key === "final-four")) return false;
      const currentDay = getMatchDaySortValue(match);
      const maxKnownDay = Math.max(0, ...(matches || []).filter((item) => item !== match).map(getMatchDaySortValue));
      return currentDay >= maxKnownDay;
    }

    function getBaseStage(match, matches = [], competition = null) {
      const explicit = getExplicitBaseStage(match);
      if (explicit) return explicit;

      const leagueDay = Number(match.leagueMatchday || 0);
      const serieDay = Number(match.serieAMatchday || 0);

      if (isLeagueCompetition(competition)) {
        if (Number.isFinite(leagueDay) && leagueDay > 0) return { key: `giornata-${leagueDay}`, label: `Giornata ${leagueDay}`, rank: 100 + leagueDay };
        if (Number.isFinite(serieDay) && serieDay > 0) return { key: `giornata-${serieDay}`, label: `Giornata ${serieDay}`, rank: 100 + serieDay };
      }

      if (shouldInferFinalForUnknownKnockout(match, matches, competition)) return { key: "finale", label: "Finale", rank: 900 };
      if (Number.isFinite(leagueDay) && leagueDay > 0) return { key: `giornata-${leagueDay}`, label: `Giornata ${leagueDay}`, rank: 100 + leagueDay };
      if (Number.isFinite(serieDay) && serieDay > 0) return { key: `serie-a-${serieDay}`, label: `Serie A ${serieDay}`, rank: 50 + serieDay };
      const fallback = String(match.matchday || match.stage || "Partite").trim() || "Partite";
      return { key: slugify(fallback) || "partite", label: fallback, rank: 0 };
    }

    function getLegCode(match, matches = [], competition = null) {
      const base = getBaseStage(match, matches, competition);
      if (base.key === "finale" || base.key.startsWith("giornata-") || base.key.startsWith("serie-a-")) return "secca";
      const text = cleanStageText(match.leg || match.roundLeg || match.matchday || "");
      if (/RITORNO|RETURN|\bRIT\b|(^|\s)R(\s|$)/.test(text)) return "ritorno";
      if (/ANDATA|FIRST|\bAND\b|(^|\s)A(\s|$)/.test(text)) return "andata";
      if (/SECCA|UNICA|SINGLE|ONE\s+LEG/.test(text)) return "secca";
      return "secca";
    }

    function buildLegContext(matches, competition) {
      const context = new Map();
      matches.forEach((match) => {
        const base = getBaseStage(match, matches, competition);
        if (!context.has(base.key)) context.set(base.key, new Set());
        const leg = getLegCode(match, matches, competition);
        if (leg === "andata" || leg === "ritorno") context.get(base.key).add(leg);
      });
      return context;
    }

    function getStageInfo(match, matches, context, competition) {
      const base = getBaseStage(match, matches, competition);
      if (base.key === "finale" || base.key.startsWith("giornata-") || base.key.startsWith("serie-a-")) return { key: base.key, label: base.label, rank: base.rank };
      const legs = context.get(base.key) || new Set();
      const hasTwoLegs = legs.has("andata") && legs.has("ritorno");
      const leg = hasTwoLegs ? getLegCode(match, matches, competition) : "secca";
      if (leg === "ritorno") return { key: `${base.key}-ritorno`, label: `${base.label} ritorno`, rank: base.rank + 20 };
      if (leg === "andata") return { key: `${base.key}-andata`, label: `${base.label} andata`, rank: base.rank + 10 };
      return { key: base.key, label: base.label, rank: base.rank + 15 };
    }

    function groupMatches(matches, competition = null) {
      const context = buildLegContext(matches, competition);
      const groups = new Map();
      matches.forEach((match) => {
        const info = getStageInfo(match, matches, context, competition);
        if (!groups.has(info.key)) groups.set(info.key, { ...info, matches: [] });
        groups.get(info.key).matches.push(match);
      });
      return [...groups.values()].sort((a, b) => b.rank - a.rank || a.label.localeCompare(b.label, "it", { numeric: true, sensitivity: "base" }));
    }

    function renderResults(results, seasonTeams = []) {
      if (!results.length) return "";
      return `
        <article class="panel">
          <div class="panel-header compact"><div><h2>Risultati / piazzamenti</h2><p>Informazioni disponibili per la competizione.</p></div></div>
          <div class="table-wrap mobile-tabular-wrap">
            <table class="mobile-tabular">
              <thead><tr><th>Pos.</th><th>Squadra</th></tr></thead>
              <tbody>${results.sort((a,b)=>Number(a.position||999)-Number(b.position||999)).map((result) => {
                const team = seasonTeams.find((item) => item.id === result.seasonTeamId);
                return `<tr><td data-label="Pos.">${escapeHtml(result.position || "-")}</td><td data-label="Squadra">${escapeHtml(result.teamName || team?.name || result.seasonTeamId || "-")}</td></tr>`;
              }).join("")}</tbody>
            </table>
          </div>
        </article>`;
    }

    function renderMatches(matches, seasonTeams = []) {
      if (!matches.length) return `<article class="panel"><p class="muted">Nessuna partita disponibile.</p></article>`;
      const groups = groupMatches(matches, currentCompetitionPayload?.competition || null);
      return groups.map((group) => `
        <details class="panel competition-page-stage-group" open>
          <summary class="competition-match-stage-summary">
            <h2>${escapeHtml(group.label)}</h2>
            <span class="button button-secondary button-small competition-stage-toggle-label" aria-hidden="true">Riduci/Espandi</span>
          </summary>
          <div class="table-wrap mobile-tabular-wrap">
            <table class="mobile-tabular">
              <thead><tr><th>Partita</th><th>G. lega</th><th>G. Serie A</th><th>Data</th><th class="number">Risultato</th></tr></thead>
              <tbody>
                ${group.matches.map((match) => `
                  <tr>
                    <td data-label="Partita">${escapeHtml(getTeamName(match, "home", seasonTeams))} - ${escapeHtml(getTeamName(match, "away", seasonTeams))}</td>
                    <td data-label="G. lega">${escapeHtml(match.leagueMatchday || "-")}</td>
                    <td data-label="G. Serie A">${escapeHtml(match.serieAMatchday || "-")}</td>
                    <td data-label="Data">${escapeHtml(match.matchDate || "-")}</td>
                    <td data-label="Risultato" class="number">${renderMatchResultHtml(match)}</td>
                  </tr>`).join("")}
              </tbody>
            </table>
          </div>
        </details>`).join("");
    }

    function showError(message) {
      errorEl.textContent = message;
      errorEl.classList.remove("hidden");
    }

    function renderPayload(payload) {
      if (!payload) {
        showError("Competizione non trovata né nei JSON statici né nello snapshot Firebase della stagione.");
        contentEl.innerHTML = "";
        return;
      }
      currentCompetitionPayload = payload;
      const competition = payload.competition || {};
      const sourceLabel = payload.source === "static" ? "JSON statico" : "Firebase";
      const sourceClass = payload.source === "static" ? "static-source-badge" : "firebase-source-badge";
      const title = competition.name || competition.competitionName || competition.label || competition.type || "Competizione";
      titleEl.textContent = title;
      subtitleEl.textContent = competition.notes || `Calendario completo della stagione ${competition.seasonId || requestedSeasonId || ""}.`;
      metaEl.innerHTML = `
        <span class="${sourceClass}">${sourceLabel}</span>
        ${competition.status ? `<span class="status status-muted">${escapeHtml(competition.status)}</span>` : ""}
        ${payload.sourceFile ? `<span class="muted small">Fonte: ${escapeHtml(payload.sourceFile)}</span>` : ""}
        <span class="muted small">${payload.matches.length} partite</span>
      `;
      contentEl.innerHTML = `${renderResults(payload.results || [], payload.seasonTeams || [])}${renderMatches(payload.matches || [], payload.seasonTeams || [])}`;
    }

    async function main() {
      const staticPayload = await loadStaticCompetition();
      if (staticPayload) {
        renderPayload(staticPayload);
        return;
      }
      const firebasePayload = await loadFirebaseCompetition();
      renderPayload(firebasePayload);
    }

    main().catch((error) => {
      console.error(error);
      showError(error.message || "Errore durante il caricamento della competizione.");
      contentEl.innerHTML = "";
    });
  </script>
</body>
</html>
