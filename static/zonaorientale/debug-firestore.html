<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Debug Firestore - ZonaOrientale</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 24px; background: #0f172a; color: #e5e7eb; }
    main { max-width: 980px; margin: 0 auto; }
    button { border: 0; border-radius: 999px; padding: 10px 14px; font-weight: 800; background: #22c55e; color: #052e16; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 18px; font-size: 14px; }
    th, td { border-bottom: 1px solid rgba(255,255,255,.12); padding: 9px; text-align: left; vertical-align: top; }
    th { color: #94a3b8; text-transform: uppercase; font-size: 12px; letter-spacing: .06em; }
    .ok { color: #86efac; font-weight: 800; }
    .ko { color: #fecaca; font-weight: 800; }
    code, pre { background: rgba(255,255,255,.06); border-radius: 8px; padding: 2px 5px; }
    pre { padding: 12px; overflow: auto; }
  </style>
</head>
<body>
<main>
  <h1>Debug Firestore</h1>
  <p>Questa pagina testa una raccolta alla volta, così capiamo quale viene bloccata dalle Security Rules o dalla configurazione.</p>
  <button id="runBtn" type="button">Esegui test</button>
  <table>
    <thead><tr><th>Raccolta</th><th>Stato</th><th>Dettaglio</th></tr></thead>
    <tbody id="results"><tr><td colspan="3">Pronto.</td></tr></tbody>
  </table>
  <h2>Info browser</h2>
  <pre id="env"></pre>
</main>
<script type="module">
  import { db, collection, getDocs } from "./assets/firebase.js?v=19";

  const COLLECTIONS = [
    "leagueSettings",
    "seasons",
    "presidents",
    "teams",
    "seasonTeams",
    "stadiums",
    "competitions",
    "competitionMatches",
    "competitionResults",
    "honorRoll",
    "fifaRankings",
      "publicSeasonSnapshots",
      "publicSnapshots",
    "rosterEntries",
    "fmMovements"
  ];

  const results = document.getElementById("results");
  const env = document.getElementById("env");
  env.textContent = JSON.stringify({ href: location.href, origin: location.origin, userAgent: navigator.userAgent }, null, 2);

  function row(name, ok, detail) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td><code>${name}</code></td><td class="${ok ? "ok" : "ko"}">${ok ? "OK" : "ERRORE"}</td><td>${detail}</td>`;
    results.appendChild(tr);
  }

  async function run() {
    results.innerHTML = "";
    for (const name of COLLECTIONS) {
      try {
        const snap = await getDocs(collection(db, name));
        row(name, true, `${snap.size} documenti letti`);
      } catch (error) {
        console.error(name, error);
        row(name, false, `<strong>${error.code || "no-code"}</strong><br>${String(error.message || error)}`);
      }
    }
  }

  document.getElementById("runBtn").addEventListener("click", run);
  run();
</script>
</body>
</html>
