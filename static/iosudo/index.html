<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ioSudo - Per i SUDATORI</title>
  <meta name="description" content="Mini app mobile per consultare Per i SUDATORI: probabili XI, mercato, ufficialita, rumors, infortunati e amichevoli." />
  <meta name="theme-color" content="#3b0619" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="stylesheet" href="../fanta-engine/css/iosudo-app-v643.css?v=643" />
</head>
<body>
  <div id="iosudoApp" class="iosudo-shell" data-iosudo-version="642">
    <header class="iosudo-topbar" aria-label="Barra ioSudo">
      <img class="iosudo-logo" src="./assets/icon.svg" alt="ioSudo: personaggio che suda pensando alla formazione del fantacalcio" />
      <div class="iosudo-topbar-copy">
        <div class="iosudo-title-line">
          <strong>ioSudo</strong>
          <span>-</span>
          <span id="iosudoLeagueName">Per i SUDATORI</span>
          <span>-</span>
          <a id="iosudoBackLink" class="iosudo-site-link" href="../zonaorientale/" aria-label="Vai al sito della lega">Vai al sito</a>
        </div>
        <div id="iosudoStatus" class="iosudo-status">Caricamento dati...</div>
      </div>
      <button id="iosudoInstallBtn" class="iosudo-install" type="button" hidden>Installa</button>
    </header>

    <main class="iosudo-main">
      <section class="iosudo-search-card" aria-label="Ricerca ioSudo">
        <label class="iosudo-search-label" for="iosudoSearch">Cerca squadra o giocatore</label>
        <input id="iosudoSearch" class="iosudo-search" type="search" placeholder="Es. Gaetano, Atalanta, Pulisic" autocomplete="off" />
        <div id="iosudoQuickFilters" class="iosudo-filter-row iosudo-global-nav" aria-label="Navigazione rapida ioSudo">
          <button class="iosudo-filter is-active" type="button" data-view="teams">SQUADRE</button>
          <button class="iosudo-filter" type="button" data-view="players">GIOCATORI</button>
          <button class="iosudo-filter" type="button" data-view="sos">SOS</button>
          <button class="iosudo-filter" type="button" data-view="rumor">RUMOR</button>
          <button class="iosudo-filter" type="button" data-view="official">UFFICIALITÀ</button>
          <button class="iosudo-filter" type="button" data-view="friendlies">AMICHEVOLI</button>
        </div>
      </section>

      <section id="iosudoSummary" class="iosudo-summary" aria-label="Riepilogo dati"></section>
      <section id="iosudoTeamFocus" class="iosudo-panel hidden" aria-live="polite"></section>
      <section id="iosudoResults" class="iosudo-results" aria-live="polite"></section>
    </main>
  </div>

  <script src="../fanta-engine/js/apps/iosudo-app-v643.js?v=643" defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
