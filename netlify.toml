[build]
  command = "bash netlify/build-hugo-0.80.sh"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  HUGO_VERSION = "0.80.0"
  HUGO_ENABLEGITINFO = "true"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "bash netlify/build-hugo-0.80.sh"

[context.branch-deploy]
  command = "bash netlify/build-hugo-0.80.sh"

[[redirects]]
  from = "/zonaorientale/static/*"
  to = "/zonaorientale/:splat"
  status = 301

[[redirects]]
  from = "/zonaorientale/share/news/:id"
  to = "/.netlify/functions/news-share?id=:id"
  status = 200

[[redirects]]
  from = "/fantapetillomantramanager/share/news/:id"
  to = "/.netlify/functions/news-share?id=:id&league=fantapetillomantramanager"
  status = 200

# V760 - Mutable public datasets must be revalidated on every navigation.
[[headers]]
  for = "/zonaorientale/assets/public/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/zonaorientale/assets/snapshots/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/fanta-engine/data/sudatori/current/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/fanta-engine/data/shared-assets/current/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# V760 - Entrypoint e config devono essere riallineati a ogni deploy.
[[headers]]
  for = "/zonaorientale/assets/app.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/zonaorientale/assets/league-config.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/fanta-engine/js/core/static-first-bootstrap-v760.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# V763 - Shell e manifest di release sempre rivalidati.
[[headers]]
  for = "/zonaorientale/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Fanta-Release = "V763"

[[headers]]
  for = "/zonaorientale/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Fanta-Release = "V763"

[[headers]]
  for = "/zonaorientale/release.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Fanta-Release = "V763"

# V763 - Il controller Admin condiviso deve essere riallineato subito.
[[headers]]
  for = "/fanta-engine/js/shared/v489/assets/js/core/admin-card-visibility-v456.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/fanta-engine/css/shared/v487/assets/css/refactor/admin-card-visibility-v456.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/zonaorientale/assets/js/core/admin-card-visibility-v456.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/zonaorientale/assets/css/refactor/admin-card-visibility-v456.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
